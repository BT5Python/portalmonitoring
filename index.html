<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TACTICAL MAP + STREET VIEW</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css">

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="
https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js">
</script>

<link rel="stylesheet"
href="
https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">

<style>

body{
margin:0;
background:black;
font-family:Courier New;
overflow:hidden;
}

#map{
height:100vh;
width:100%;
}

#panel{

position:absolute;

top:10px;
left:10px;

z-index:9999;

background:
rgba(0,0,0,.8);

padding:10px;

border:
1px solid #00ff00;

color:#00ff00;

}

button{

background:black;

color:#00ff00;

border:
1px solid #00ff00;

padding:8px;

margin:2px;

cursor:pointer;

}

#street{

position:absolute;

top:0;
left:0;

width:100%;
height:100%;

z-index:99999;

display:none;

}

.grid{

position:absolute;

width:100%;
height:100%;

background-image:

linear-gradient(
#00ff0020 1px,
transparent 1px),

linear-gradient(
90deg,
#00ff0020 1px,
transparent 1px);

background-size:
40px 40px;

pointer-events:none;

z-index:999;

}

</style>

</head>

<body>

<div class="grid"></div>

<div id="panel">

SYSTEM ONLINE

<br><br>

<button onclick="mulaiGPS()">

📡 TRACK

</button>

<button onclick="bukaStreet()">

🛰 STREET VIEW

</button>

<button onclick="tutupStreet()">

❌ CLOSE

</button>

<br><br>

LAT :
<span id="lat">0</span>

<br>

LON :
<span id="lon">0</span>

</div>

<div id="map"></div>

<div id="street"></div>

<script>

let map =
L.map('map')
.setView(
[-6.914744,
107.609810],
17
);

L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
).addTo(map);

let marker =
L.marker(
[-6.914744,
107.609810]
)
.addTo(map);

function mulaiGPS(){

navigator.geolocation.watchPosition(

(pos)=>{

let lat =
pos.coords.latitude;

let lon =
pos.coords.longitude;

document.getElementById(
"lat"
).innerHTML =
lat;

document.getElementById(
"lon"
).innerHTML =
lon;

marker.setLatLng(
[lat,lon]
);

map.setView(
[lat,lon]
);

google.script.run
.simpanLokasi(
lat,
lon
);

},

(err)=>{

alert(
"GPS ERROR"
);

},

{

enableHighAccuracy:true,

maximumAge:0

}

);

}

function bukaStreet(){

document.getElementById(
"street"
).style.display=
"block";

pannellum.viewer(

'street',

{

type:
"equirectangular",

panorama:
"360.jpg",

autoLoad:
true,

showControls:
true,

hotSpots:[

{

pitch:0,

yaw:20,

text:
"NEXT",

clickHandlerFunc:()=>{

alert(
"PINDAH TITIK"
);

}

}

]

}

);

}

function tutupStreet(){

document.getElementById(
"street"
).style.display=
"none";

}

</script>

</body>
</html>
