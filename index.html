<!DOCTYPE html>
<html>
<head>

<script src="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Cesium.js"></script>

<link href="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Widgets/widgets.css"
rel="stylesheet">

<style>

html,body,#cesiumContainer{
width:100%;
height:100%;
margin:0;
overflow:hidden;
background:black;
}

#hud{

position:absolute;

top:10px;
left:10px;

z-index:9999;

background:
rgba(0,0,0,.8);

color:#00ff00;

padding:10px;

border:
1px solid #00ff00;

font-family:
Courier New;

}

</style>

</head>

<body>

<div id="hud">

GPS ONLINE

<br>

LAT :
<span id="lat">0</span>

<br>

LON :
<span id="lon">0</span>

</div>

<div id="cesiumContainer"></div>

<script>

Cesium.Ion.defaultAccessToken='';

const viewer=
new Cesium.Viewer(
'cesiumContainer',
{

terrain:
Cesium.Terrain.fromWorldTerrain(),

animation:false,

timeline:false,

baseLayerPicker:false

}

);

let entity=
viewer.entities.add({

position:
Cesium.Cartesian3.fromDegrees(
107.609810,
-6.914744,
100
),

point:{
pixelSize:12
}

});

viewer.flyTo(entity);

navigator.geolocation.watchPosition(

(pos)=>{

let lat=
pos.coords.latitude;

let lon=
pos.coords.longitude;

document.getElementById(
"lat"
).innerHTML=
lat;

document.getElementById(
"lon"
).innerHTML=
lon;

entity.position=
Cesium.Cartesian3.fromDegrees(
lon,
lat,
100
);

viewer.camera.flyTo({

destination:
Cesium.Cartesian3.fromDegrees(
lon,
lat,
1500
),

orientation:{

pitch:
Cesium.Math.toRadians(
-45
)

}

});

}

);

</script>

</body>
</html>
