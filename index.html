<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css">

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>

body{
margin:0;
background:#000;
font-family:Courier New;
overflow:hidden;
}

#map{
height:100vh;
width:100%;
filter:
hue-rotate(80deg)
brightness(.7)
contrast(1.3);
}

#hud{

position:absolute;

top:10px;
left:10px;

z-index:9999;

background:
rgba(0,0,0,.8);

border:
1px solid #00ff00;

padding:10px;

color:#00ff00;

box-shadow:
0 0 20px #00ff00;

}

#radar{

position:absolute;

right:20px;
bottom:20px;

width:150px;
height:150px;

border-radius:50%;

border:
2px solid #00ff00;

box-shadow:
0 0 20px #00ff00;

z-index:9999;

overflow:hidden;

}

#scan{

width:100%;
height:2px;

background:#00ff00;

position:absolute;

animation:
scan 2s linear infinite;

box-shadow:
0 0 20px #00ff00;

}

@keyframes scan{

0%{
top:0;
}

100%{
top:150px;
}

}

.grid{

position:absolute;

width:100%;
height:100%;

background-image:
linear-gradient(
#00ff0030 1px,
transparent 1px),

linear-gradient(
90deg,
#00ff0030 1px,
transparent 1px);

background-size:
40px 40px;

z-index:999;

pointer-events:none;

}

</style>

</head>

<body>

<div class="grid"></div>

<div id="hud">

SYSTEM : ONLINE<br>

LAT :
<span id="lat">
0
</span>

<br>

LON :
<span id="lon">
0
</span>

</div>

<div id="radar">
<div id="scan"></div>
</div>

<div id="map"></div>

<script>

let map=
L.map(
'map'
).setView(
[-6.914744,
107.609810],
17
);

L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
).addTo(map);

let marker=
L.marker(
[-6.914744,
107.609810]
).addTo(map);

navigator.geolocation.watchPosition(

(pos)=>{

let lat=
pos.coords.latitude;

let lon=
pos.coords.longitude;

marker.setLatLng(
[lat,lon]
);

map.setView(
[lat,lon]
);

document.getElementById(
"lat"
).innerHTML=
lat;

document.getElementById(
"lon"
).innerHTML=
lon;

}

);

</script>

</body>
</html>
