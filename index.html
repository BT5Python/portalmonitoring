<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TACTICAL TRACKING</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css">

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>

body{
margin:0;
background:black;
font-family:Courier New;
overflow:hidden;
color:#00ff00;
}

#map{
width:100%;
height:100vh;
}

#panel{

position:absolute;

top:10px;
left:10px;

z-index:9999;

width:280px;

background:
rgba(0,0,0,.85);

border:
1px solid #00ff00;

padding:10px;

box-shadow:
0 0 15px #00ff00;

}

button{

background:black;

color:#00ff00;

border:
1px solid #00ff00;

padding:8px;

margin:2px;

cursor:pointer;

}

.member{

border-bottom:
1px solid #00ff0030;

padding:5px;

margin-top:5px;

}

.online{
color:#00ff00;
}

.offline{
color:red;
}

</style>

</head>

<body>

<div id="panel">

TACTICAL TRACKER

<br><br>

<button onclick="mulaiTracking()">

📡 START

</button>

<button onclick="modeSatelit()">

🛰 SAT

</button>

<button onclick="modeNormal()">

🗺 MAP

</button>

<hr>

<div id="anggotaList">

BELUM ADA DATA

</div>

</div>

<div id="map"></div>

<script>

let map =
L.map('map')
.setView(
[-6.914744,107.609810],
13
);

let normal =
L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
);

let sat =
L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
);

normal.addTo(map);

function modeSatelit(){

map.removeLayer(normal);

sat.addTo(map);

}

function modeNormal(){

map.removeLayer(sat);

normal.addTo(map);

}

let anggota={};

function updateAnggota(
id,
nama,
lat,
lon
){

if(!anggota[id]){

anggota[id]={

marker:
L.marker(
[lat,lon]
).addTo(map),

jalur:
L.polyline(
[],
{
color:"lime"
}
).addTo(map),

last:
Date.now()

};

}

anggota[id]
.marker
.setLatLng(
[lat,lon]
);

anggota[id]
.marker
.bindPopup(

nama+

"<br>"+

lat+

"<br>"+

lon

);

anggota[id]
.jalur
.addLatLng(
[lat,lon]
);

anggota[id]
.last=
Date.now();

renderPanel();

}

function renderPanel(){

let html="";

for(let id in anggota){

let st =

(Date.now()-

anggota[id].last)

<15000 ?

"ONLINE"

:

"OFFLINE";

html += `

<div class="member">

ID :

${id}

<br>

STATUS :

<span class="${
st=="ONLINE"?
"online":
"offline"
}">

${st}

</span>

</div>

`;

}

document.getElementById(
"anggotaList"
).innerHTML=
html;

}

function mulaiTracking(){

let id=
prompt(
"ID ANGGOTA"
);

let nama=
prompt(
"NAMA"
);

navigator.geolocation
.watchPosition(

(pos)=>{

let lat=
pos.coords.latitude;

let lon=
pos.coords.longitude;

updateAnggota(
id,
nama,
lat,
lon
);

google.script.run
.simpanLokasi(
id,
nama,
lat,
lon
);

map.setView(
[lat,lon]
);

},

(err)=>{

alert(
"GPS ERROR"
);

},

{

enableHighAccuracy:true,

maximumAge:0

}

);

}

setInterval(
renderPanel,
5000
);

</script>

</body>
</html>
