<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<title>TRACKING 3D</title>

<script src="
https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Cesium.js">
</script>

<link rel="stylesheet"
href="
https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Widgets/widgets.css">

<style>

body{
margin:0;
background:black;
color:#00ff00;
font-family:Courier New;
}

#topbar{

position:absolute;

top:0;

width:100%;

padding:10px;

background:#111;

z-index:9999;

}

button{

background:black;

color:#00ff00;

border:1px solid #00ff00;

padding:8px;

}

#cesiumContainer{

height:100vh;

width:100%;

}

</style>

</head>

<body>

<div id="topbar">

<button onclick="mulaiTracking()">

📡 TRACKING

</button>

<span id="status">

OFFLINE

</span>

</div>

<div id="cesiumContainer">

</div>

<script>

Cesium.Ion.defaultAccessToken='';

const viewer =
new Cesium.Viewer(
'cesiumContainer',
{

terrain:
Cesium.Terrain.fromWorldTerrain(),

animation:false,

timeline:false

}

);

let target =
viewer.entities.add({

position:
Cesium.Cartesian3.fromDegrees(
107.609810,
-6.914744,
100
),

point:{

pixelSize:15

}

});

function mulaiTracking(){

document.getElementById(
"status"
).innerHTML=
"ONLINE";

navigator.geolocation.watchPosition(

(pos)=>{

let lat =
pos.coords.latitude;

let lon =
pos.coords.longitude;

target.position=

Cesium.Cartesian3
.fromDegrees(

lon,

lat,

100

);

viewer.camera.flyTo({

destination:

Cesium.Cartesian3
.fromDegrees(

lon,

lat,

2000

),

orientation:{

pitch:
Cesium.Math.toRadians(
-45
)

}

});

google.script.run
.simpanLokasi(
lat,
lon
);

}

);

}

</script>

</body>

</html>
