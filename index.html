<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TRACKING ANGGOTA</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>

body{
margin:0;
background:black;
color:#00ff00;
font-family:Courier New;
}

#topbar{
padding:10px;
background:#111;
border-bottom:1px solid #00ff00;
}

button{
background:black;
color:#00ff00;
border:1px solid #00ff00;
padding:8px;
margin:2px;
cursor:pointer;
}

#map{
height:calc(100vh - 70px);
width:100%;
}

</style>

</head>
<body>

<div id="topbar">

<button onclick="mulaiTracking()">
📡 MULAI TRACKING
</button>

<button onclick="modeSatelit()">
🛰 SATELIT
</button>

<button onclick="modeNormal()">
🗺 NORMAL
</button>

<span id="status">
OFFLINE
</span>

</div>

<div id="map"></div>

<script>

let map =
L.map('map').setView(
[-6.914744,107.609810],
15
);

let normalLayer =
L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
);

let satelitLayer =
L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
);

normalLayer.addTo(map);

let marker =
L.marker(
[-6.914744,107.609810]
).addTo(map);

function modeSatelit(){

map.removeLayer(normalLayer);

satelitLayer.addTo(map);

}

function modeNormal(){

map.removeLayer(satelitLayer);

normalLayer.addTo(map);

}

function mulaiTracking(){

document.getElementById(
"status"
).innerHTML="ONLINE";

navigator.geolocation.watchPosition(

(pos)=>{

let lat =
pos.coords.latitude;

let lon =
pos.coords.longitude;

marker.setLatLng(
[lat,lon]
);

map.setView(
[lat,lon]
);

marker.bindPopup(
`
LAT : ${lat}
<br>
LON : ${lon}
`
);

google.script.run
.simpanLokasi(
lat,
lon
);

},

(err)=>{

alert(
"GAGAL GPS"
);

},

{
enableHighAccuracy:true,
maximumAge:0,
timeout:5000
}

);

}

</script>

</body>
</html>
